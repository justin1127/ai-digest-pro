name: Daily AI Digest

on:
  schedule:
    # Primary run: 05:17 Asia/Shanghai. Avoids GitHub's top-of-hour scheduler congestion.
    - cron: "17 21 * * *"
    # Backup run: 07:17 Asia/Shanghai. No-op if the primary run already published.
    - cron: "17 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select five ranked signals
        run: python3 generate.py --fetch --limit 5 --export-items .tmp/candidates.json --no-render

      - name: Install GitHub Models client
        run: gh extension install https://github.com/github/gh-models
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Produce Chinese decision analysis
        run: cat .tmp/candidates.json | gh models run --file prompts/daily-decision-brief.prompt.yml > .tmp/editorial.json
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Render Chinese daily digest
        run: python3 generate.py --items-file .tmp/candidates.json --editorial-file .tmp/editorial.json --limit 5

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html *.html data/*.json
          if git diff --cached --quiet; then
            echo "No digest changes to publish."
            exit 0
          fi
          git commit -m "AI决策情报 $(TZ=Asia/Shanghai date +'%Y.%m.%d')"
          git push
